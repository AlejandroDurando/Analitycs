name: Daily Dashboard Update

on:
  schedule:
    # 07:00 AM CDMX is 13:00 UTC (during CDMX Standard Time/UTC-6)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes
      pages: write    # Needed if deploying to Pages directly from Action
      id-token: write # Needed for Pages
    outputs:
      # 'success' solo si GitHub Pages está habilitado; el job deploy lo usa
      # para saltarse el despliegue cuando Pages no está configurado.
      pages_ready: ${{ steps.pages.outcome }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Fetch & AI Script
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-data.js
        
      - name: Commit Data Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data.json history/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "data: Auto-update AI Trends dashboard [skip ci]"
          git push

      # --- GitHub Pages (opcional) ---
      # El despliegue a Pages es un extra: el hosting principal es Vercel, que
      # redespliega solo con cada push a main. Estos pasos se marcan como no
      # bloqueantes (continue-on-error) para que un problema de Pages —p. ej.
      # que no esté habilitado y el token no pueda crearlo— nunca tumbe la
      # actualización diaria de datos. Si activas Pages (Settings > Pages >
      # Source: GitHub Actions), el despliegue funcionará automáticamente.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Build Dashboard
        run: npm run build

      - name: Upload artifact for GitHub Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: update-dashboard
    runs-on: ubuntu-latest
    # Solo intenta desplegar a Pages si está habilitado (artefacto subido).
    if: needs.update-dashboard.outputs.pages_ready == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
